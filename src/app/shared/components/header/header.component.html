<ion-header class="ion-no-border cozy-solid-header cozy-star-grid">
  <ion-toolbar class="cozy-navbar">
    
    <!-- Botón de menú e Impacto en Momentos a la izquierda -->
    <div class="left-nav-section" slot="start">
      <ion-buttons>
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <a routerLink="/home" class="brand-title">Impacto en Momentos</a>
    </div>

    <!-- Contenedor central de navegación en pastillas -->
    <div class="pills-navigation-container">
      <div class="pills-pillbox">
        <a routerLink="/home" routerLinkActive="active" class="nav-pill">Home</a>
        <a routerLink="/organizations" routerLinkActive="active" class="nav-pill">Organizaciones</a>
        @if (user(); as currentUser) {
          <a [routerLink]="tasksLink" (click)="$any($event.currentTarget).blur()" routerDirection="root" lines="none" routerLinkActive="active" class="nav-pill">Mis Tareas</a>
         }
        <a routerLink="/about" routerLinkActive="active" class="nav-pill">Sobre Nosotros</a>
      </div>
    </div>

    <!-- Accesos rápidos y etiqueta de Cuenta a la derecha -->
    <div class="right-icon-dock" slot="end">
      <div class="profile-dock-item">
        <button 
          class="icon-circle-btn bg-sage" 
          [routerLink]="profileRoute()" 
          aria-label="Mi Perfil">
          <i class="hn hn-user-solid"></i>
        </button>
        <span class="dock-label">Cuenta</span>
      </div>

      @if (authService.isAuthenticated()) {
        <div class="profile-dock-item">
          <button 
            class="icon-circle-btn bg-terracotta" 
            (click)="authService.logout()" 
            aria-label="Cerrar sesión">
            <i class="hn hn-login"></i>
          </button>
          <span class="dock-label">Salir</span>
        </div>
      }
    </div>

  </ion-toolbar>
  
  <!-- Línea divisoria decorativa del encabezado -->
  <div class="header-divider-line"></div>
</ion-header>
