<div class="modal-container">
  
  <div class="modal-toolbar">
    <div class="modal-title">
      <i class="hn hn-plus"></i>
      <span>{{ taskData ? 'Editar Microtarea' : 'Nueva Microtarea' }}</span>
    </div>
    <button type="button" class="close-btn" (click)="cancel()" [disabled]="isSaving()">
      <i class="hn hn-times"></i>
    </button>
  </div>

  <div class="modal-body">
    <form [formGroup]="taskForm" (ngSubmit)="save()">
      
      <div class="form-group">
        <label class="form-label">Título de la tarea *</label>
        <input 
          type="text" 
          class="custom-input" 
          formControlName="title"
          placeholder="Ej: Traducir documento al inglés" 
        />
      </div>

      <div class="form-row ion-margin-top">
        <div class="form-group half-width">
          <label class="form-label"><i class="hn hn-clock"></i> Tiempo estimado *</label>
          <input 
            type="text" 
            class="custom-input" 
            formControlName="estimatedTime"
            placeholder="Ej: 30 mins" 
          />
        </div>

        <div class="form-group half-width">
          <label class="form-label"><i class="hn hn-calendar"></i> Fecha límite *</label>
          <input 
            type="date" 
            class="custom-input" 
            formControlName="deadline"
          />
        </div>
      </div>

      <div class="form-group ion-margin-top">
        <label class="form-label"><i class="hn hn-align-left"></i> Descripción breve</label>
        <textarea 
          class="custom-textarea" 
          formControlName="description"
          rows="4" 
          placeholder="Explica detalladamente en qué consiste el apoyo requerido..."
        ></textarea>
      </div>

      <div class="modal-actions ion-margin-top">
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="isSaving()">
          Cancelar
        </button>

        <!-- Botón condicional si es modo edición/creación (ONG) o si el voluntario va a reclamar -->
        @if (isOrgMode) {
          <button type="submit" class="btn-primary" [disabled]="isSaving() || taskForm.invalid">
            @if (isSaving()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              <span>{{ taskData ? 'Guardar Cambios' : 'Publicar Tarea' }}</span>
            }
          </button>
        } @else {
          <button type="button" class="btn-primary" (click)="claimTask()" [disabled]="isSaving()">
            @if (isSaving()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              <span>Apuntarse a la Tarea</span>
            }
          </button>
        }
      </div>

    </form>
  </div>

</div>
