<ion-header class="ion-no-border cozy-modal-header">
  <ion-toolbar class="cozy-navbar">
    <ion-title class="cozy-modal-title">
      {{ isOrgMode ? 'Editar Organización' : 'Editar Mi Perfil' }}
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()" class="cancel-text-btn" [disabled]="isSaving()">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="cozy-star-grid ion-padding">
  <div class="modal-form-container">
    
    <!-- Nombre / Razón Social -->
    <div class="cozy-input-wrapper ion-margin-bottom">
      <ion-item lines="none" class="clean-item">
        <ion-input 
          [label]="isOrgMode ? 'Razón Social' : 'Nombre Completo'" 
          label-placement="stacked" 
          maxlength="80"
          [(ngModel)]="displayName">
        </ion-input>
      </ion-item>
    </div>

    <!-- Biografía / Descripción -->
    <div class="cozy-input-wrapper ion-margin-bottom">
      <ion-item lines="none" class="clean-item">
        <ion-textarea 
          [label]="isOrgMode ? 'Descripción Institucional' : 'Sobre mí'" 
          label-placement="stacked" 
          [rows]="4"
          maxlength="500"
          [(ngModel)]="description">
        </ion-textarea>
      </ion-item>
    </div>

    <!-- Botón Guardar -->
    <ion-button 
      expand="block" 
      class="cozy-action-button"
      [disabled]="isSaving() || !displayName.trim()"
      (click)="save()">
      @if (isSaving()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Guardar Cambios
      }
    </ion-button>

  </div>
</ion-content>
