<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>
      Dashboard
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>

  @if (auth.user$ | async; as user) {

    <ion-avatar>
      <img [src]="user.photoURL" 
      (error)="onImageError($event)"
      />
      
    </ion-avatar>

    <h2>{{ user.displayName }}</h2>
    <p>{{ user.email }}</p>

  }

</ion-content>
