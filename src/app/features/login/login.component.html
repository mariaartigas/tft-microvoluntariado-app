<ion-content class="login-page">
  <div class="login-container">
    <div class="login-card">
      <h1>Iniciar sesión</h1>
      <p class="subtitle">
        Accede a tu cuenta de Impacto en Momentos
      </p>

      <form [formGroup]="logInForm">
        <ion-input
          label="Email"
          labelPlacement="stacked"
          fill="outline"
          type="email"
          formControlName="email">
        </ion-input>

        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          fill="outline"
          type="password"
          formControlName="password">
        </ion-input>

        <div class="remember">
          <ion-checkbox></ion-checkbox>
          <span>Mantener sesión iniciada</span>
        </div>

        <ion-button
          expand="block"
          class="main-button"
          (click)="login()">
          Iniciar sesión
        </ion-button>

        <div class="separator">
          <span></span>
          <p>o</p>
          <span></span>
        </div>

        <ion-button
          expand="block"
          fill="outline"
          class="google-button"
          (click)="loginWithGoogle()">
          Continuar con Google
        </ion-button>

        <!-- ─── NUEVA SECCIÓN: ENTRADA PARA ORGANIZACIONES ─── -->
        <div class="org-divider"></div>
        <p class="register org-section">
  ¿Representas a una ONG?
        <ion-button
          fill="clear" 
          routerLink="/register-organization" 
          class="org-link-btn">
          Registra tu organización
        </ion-button>
        </p>
      </form>
    </div>
  </div>
</ion-content>
