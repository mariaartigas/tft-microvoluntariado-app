<ion-content class="cozy-star-grid login-page">
  <!-- Barra superior minimalista: solo el nombre de la app a la izquierda -->
  <div class="login-header-bar">
    <span class="app-logo-text">Impacto en Momentos</span>
  </div>

  <!-- Contenedor principal expandido y centrado -->
  <div class="login-container">
    <div class="cozy-card login-card">
      <h1 class="main-title">Impacto en Momentos</h1>
      <p class="subtitle reading-text">
        Actualmente solo permitimos el acceso mediante Google para garantizar una autenticación rápida y segura.
      </p>

      <div class="login-actions">
        <ion-button
          expand="block"
          fill="outline"
          class="google-button"
          (click)="loginWithGoogle()">
          Continuar con Google
        </ion-button>
      </div>

      <!-- Separador sutil -->
      <div class="org-divider"></div>
      
      <!-- Sección para registro de ONGs -->
      <p class="register org-section">
        ¿Representas a una ONG?
        <ion-button
          fill="clear" 
          routerLink="/register-organization" 
          class="org-link-btn">
          Registra tu organización
        </ion-button>
      </p>
    </div>
  </div>

  <!-- Footer integrado al final con el contenedor global -->
  <div class="footers-wrapper">
    <app-footer></app-footer>
  </div>
</ion-content>
